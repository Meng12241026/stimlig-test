name: StimligInvoice
options:
  bundleIdPrefix: com.stimlig
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  StimligInvoice:
    type: application
    platform: iOS
    sources:
      - StimligInvoice
    info:
      path: StimligInvoice/Resources/Info.plist
      properties:
        CFBundleDisplayName: 發票掃描
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用來掃描發票上的文字
        NSPhotoLibraryUsageDescription: 用來從相簿選取發票圖片
        CFBundleLocalizations:
          - zh-Hant
          - en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stimlig.invoice
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
