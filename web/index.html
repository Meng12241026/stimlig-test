<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a84ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="發票掃描">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>發票掃描</title>
</head>
<body>
  <main id="app">
    <!-- 發票分頁 -->
    <section class="tab-panel" data-tab="invoices" hidden>
      <header class="page-header">
        <h1>發票</h1>
        <button id="btn-scan" class="btn-primary" aria-label="掃描新發票">
          <span aria-hidden="true">＋</span> 掃描
        </button>
      </header>
      <div id="invoice-list" class="invoice-list" aria-live="polite"></div>
      <div id="invoice-empty" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">📄</div>
        <h2>還沒有任何發票</h2>
        <p>按右上角「掃描」開始</p>
        <button class="btn-primary" data-action="scan">掃描第一張</button>
      </div>
    </section>

    <!-- 統計分頁 -->
    <section class="tab-panel" data-tab="stats" hidden>
      <header class="page-header">
        <h1>統計</h1>
      </header>
      <div class="range-picker" role="tablist">
        <button class="range-option active" data-range="week">本週</button>
        <button class="range-option" data-range="month">本月</button>
        <button class="range-option" data-range="year">本年</button>
        <button class="range-option" data-range="all">全部</button>
      </div>
      <div class="card summary-card">
        <div class="summary-label">總支出</div>
        <div class="summary-amount" id="stats-total">$0</div>
        <div class="summary-count" id="stats-count">0 張發票</div>
      </div>
      <div class="card">
        <h2>科目分佈</h2>
        <canvas id="stats-chart" width="300" height="300" aria-label="科目支出圓餅圖"></canvas>
      </div>
      <div class="card">
        <h2>明細</h2>
        <div id="stats-breakdown"></div>
      </div>
    </section>

    <!-- 匯出分頁 -->
    <section class="tab-panel" data-tab="export" hidden>
      <header class="page-header">
        <h1>匯出</h1>
      </header>
      <div class="card summary-card">
        <div class="summary-label">即將匯出</div>
        <div class="summary-row">
          <span class="summary-amount" id="export-count">0</span>
          <span class="summary-secondary">張發票</span>
          <span class="summary-amount-right" id="export-total">$0</span>
        </div>
      </div>
      <button id="btn-share" class="action-card" disabled>
        <div class="action-icon" aria-hidden="true">📤</div>
        <div class="action-text">
          <div class="action-title">分享 / 同步</div>
          <div class="action-subtitle">透過 iOS 分享面板送到 Mail、Google Sheets、iCloud Drive、Files…</div>
        </div>
      </button>
      <button id="btn-download" class="action-card" disabled>
        <div class="action-icon" aria-hidden="true">⬇️</div>
        <div class="action-text">
          <div class="action-title">下載 CSV 到手機</div>
          <div class="action-subtitle">存到「檔案」App 或下載資料夾</div>
        </div>
      </button>
      <button id="btn-mail" class="action-card" disabled>
        <div class="action-icon" aria-hidden="true">✉️</div>
        <div class="action-text">
          <div class="action-title">用 Email 寄出</div>
          <div class="action-subtitle">開啟 Mail App 並帶好主旨（CSV 需手動拖入）</div>
        </div>
      </button>
    </section>
  </main>

  <!-- 底部分頁列 -->
  <nav class="tab-bar" role="tablist">
    <button class="tab-item active" data-tab="invoices">
      <span class="tab-icon" aria-hidden="true">📄</span>
      <span class="tab-label">發票</span>
    </button>
    <button class="tab-item" data-tab="stats">
      <span class="tab-icon" aria-hidden="true">📊</span>
      <span class="tab-label">統計</span>
    </button>
    <button class="tab-item" data-tab="export">
      <span class="tab-icon" aria-hidden="true">📤</span>
      <span class="tab-label">匯出</span>
    </button>
  </nav>

  <!-- 掃描 / 編輯 modal -->
  <div id="scan-modal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <button class="modal-close" data-close>✕</button>
        <h2 id="modal-title">掃描發票</h2>
        <button class="modal-save" id="modal-save" hidden>儲存</button>
      </header>
      <div class="modal-body">
        <!-- 起始畫面：開啟相機 / 從相簿選 -->
        <div id="scan-start" class="scan-start">
          <div class="scan-icon" aria-hidden="true">📷</div>
          <p>對準發票按下圓鈕，自動填好金額與分類</p>
          <button type="button" class="btn-primary btn-large" id="btn-open-camera">
            開啟相機掃描
          </button>
          <label class="btn-secondary btn-large">
            <input type="file" accept="image/*" id="gallery-input" hidden>
            從相簿選取
          </label>
        </div>

        <!-- 即時相機預覽 -->
        <div id="scan-camera" class="scan-camera" hidden>
          <video id="camera-video" class="camera-video" autoplay playsinline muted></video>
          <div class="camera-frame" aria-hidden="true"></div>
          <div class="camera-hint">把發票對齊框內，點下方圓鈕拍下</div>
          <div class="camera-controls">
            <button type="button" class="camera-cancel" id="btn-camera-cancel" aria-label="取消">✕</button>
            <button type="button" class="camera-shutter" id="btn-camera-shutter" aria-label="拍下"></button>
            <div class="camera-spacer"></div>
          </div>
          <canvas id="camera-canvas" hidden></canvas>
        </div>

        <!-- 處理中 -->
        <div id="scan-processing" class="scan-processing" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <p id="ocr-status">辨識中…</p>
          <p class="ocr-progress" id="ocr-progress"></p>
        </div>

        <!-- 編輯表單 -->
        <form id="invoice-form" class="invoice-form" hidden>
          <img id="preview-image" class="preview-image" alt="發票預覽" hidden>
          <div class="form-section">
            <h3>基本資訊</h3>
            <label>店家
              <input type="text" name="sellerName" required>
            </label>
            <label>日期
              <input type="date" name="date" required>
            </label>
            <label>金額
              <input type="number" name="totalAmount" step="0.01" min="0" required>
            </label>
            <label>稅額（可空）
              <input type="number" name="taxAmount" step="0.01" min="0">
            </label>
          </div>
          <div class="form-section">
            <h3>發票</h3>
            <label>發票號碼
              <input type="text" name="invoiceNumber" placeholder="AB-12345678">
            </label>
            <label>賣方統編
              <input type="text" name="sellerTaxID" inputmode="numeric" maxlength="8">
            </label>
            <label>買方統編
              <input type="text" name="buyerTaxID" inputmode="numeric" maxlength="8">
            </label>
          </div>
          <div class="form-section">
            <h3>會計科目</h3>
            <select name="category" id="category-select"></select>
          </div>
          <div class="form-section">
            <h3>品項</h3>
            <textarea name="itemsDescription" rows="3"></textarea>
          </div>
          <input type="hidden" name="rawText">
          <input type="hidden" name="id">
          <button type="button" class="btn-danger" id="btn-delete" hidden>刪除這張發票</button>
        </form>
      </div>
    </div>
  </div>

  <!-- toast 訊息 -->
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Tesseract.js 從 CDN 載入 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
